approval_policy = "on-request"
approvals_reviewer = "user"

[features]
hooks = true

[mcp_servers.vera]
url = "https://mcp.vera.example/mcp"
http_headers = { Authorization = "Bearer <VERA_MCP_JWT>" }
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 60
default_tools_approval_mode = "writes"
