[project]
name = "vera"
version = "0.1.0"
description = "VERA: Verified Episodic Recall for Agents, a shared verified agent-memory platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "The VERA Authors" }]
license = { file = "LICENSE" }
keywords = [
    "agent-memory",
    "knowledge-graph",
    "mcp",
    "graphiti",
    "retrieval",
    "bi-temporal",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # --- API + MCP surface ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "mcp>=2.1.1",
    # --- domain / validation / config ---
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # --- persistence (source of truth) ---
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    # --- observability / logging ---
    "structlog>=26.1.0",
    # --- http + resilience ---
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
]

# Optional stacks are grouped so the base skeleton installs lean and runnable.
# Install everything into the active conda env with: pip install -e ".[all]"
[project.optional-dependencies]
# Graphiti is pinned to a tested 0.29.x range: VERA depends on lower-level driver primitives
# (see the Graphiti compatibility contract tests), so a minor bump must be vetted first.
memory = [
    "graphiti-core>=0.29.3,<0.30",
    "neo4j>=6.3.0",
]
# Optional FalkorDB graph backend (VERA_MEMORY__GRAPH_BACKEND=falkordb), a full Neo4j
# alternative: on FalkorDB VERA runs its own hybrid stage-1 search (fulltext + vector RRF)
# since Graphiti's search returns nothing there. See docs/architecture.md.
falkordb = [
    "graphiti-core[falkordb]>=0.29.3,<0.30",
]
objectstore = [
    "aioboto3>=15.5.0",
]
observability = [
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-asyncpg>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]
resilience = [
    # Circuit breaking is in-house (a small async breaker) to avoid a legacy
    # pkg_resources import and keep the dependency surface small; retry uses tenacity.
    "cachetools>=7.1.7",
    # RESP client for the distributed rate limiter. Speaks to Valkey or any
    # redis-compatible server; no cloud lock-in.
    "redis>=8.1.0",
]
security = [
    # OAuth 2.1 Resource Server / OIDC JWT verification (API and MCP auth).
    "pyjwt>=2.13.0",
]
dev = [
    "ruff>=0.16.5",
    "pyright>=1.1.411",
    "pre-commit>=4.6.2",
    "import-linter>=2.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "factory-boy>=3.3.3",
    "testcontainers[postgres,neo4j]>=4.15.0",
    "detect-secrets>=1.5",
    "pip-audit>=2.10.1",
    # pip-audit pulls CacheControl -> msgpack; pin the patched msgpack (PYSEC-2026-3625).
    "msgpack>=1.2.2",
]
all = [
    "vera[memory,objectstore,observability,resilience,security,falkordb,dev]",
]

[project.urls]
Homepage = "https://github.com/KKloudTarus/vera"
Repository = "https://github.com/KKloudTarus/vera"
Issues = "https://github.com/KKloudTarus/vera/issues"
Documentation = "https://github.com/KKloudTarus/vera#readme"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera"]

# ------------------------------------------------------------------ tooling ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle · I isort · B bugbear · UP pyupgrade
# ASYNC async-correctness · S bandit-security · C4 comprehensions · SIM · RUF
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]                  # assert is fine in tests
"evals/tests/**" = ["S101"]            # assert is fine in evaluator tests
"migrations/**" = ["E501", "S608"]     # author-written DDL, long SQL lines are fine
# The full-text queries interpolate only a module constant (the OR-query wrapper); every
# value (:q, :g, :lim, :as_of) is a bound parameter, so there is no injection surface.
"src/vera/adapters/persistence/repositories/passage_index.py" = ["S608"]
"src/vera/adapters/persistence/repositories/pgvector_index.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["vera", "evals"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that need real Postgres/Neo4j (testcontainers)",
    "issue6_acceptance: mandatory end-to-end acceptance scenarios for issue #6",
    "llm: opt-in tests that call real LLM providers (nightly only)",
]

[tool.coverage.run]
source = ["src/vera"]
branch = true

# ---- import-linter: architecture enforced by CI, not by convention ----------

[tool.importlinter]
root_package = "vera"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architecture layering (imports point inward only)"
type = "layers"
layers = [
    "vera.entrypoints",
    "vera.adapters",
    "vera.application",
    "vera.domain",
]
# vera.shared, vera.config, vera.observability are cross-cutting and unconstrained.

[[tool.importlinter.contracts]]
name = "Domain and application stay pure (no infrastructure)"
type = "forbidden"
source_modules = ["vera.domain", "vera.application"]
forbidden_modules = [
    "graphiti_core",
    "sqlalchemy",
    "asyncpg",
    "boto3",
    "aioboto3",
    "neo4j",
    "fastapi",
    "httpx",
]
