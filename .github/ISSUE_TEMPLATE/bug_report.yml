name: Bug report
description: Report a defect in VERA
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security vulnerability, do not file a public issue:
        follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The minimal steps, request, or config that triggers it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The git commit or release you are running.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and which process (api / worker / mcp).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output or a stack trace. Redact any secrets.
      render: shell
    validations:
      required: false
