name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build immutable candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify source commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "${#REQUESTED_SHA}" -ne 40 ]; then
            echo "source_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi
          case "$REQUESTED_SHA" in
            *[!0-9a-f]*)
              echo "source_sha must be a full lowercase Git SHA" >&2
              exit 1
              ;;
          esac
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$REQUESTED_SHA" ]; then
            echo "checked-out commit ${actual_sha} differs from requested commit" >&2
            exit 1
          fi
          echo "sha=${actual_sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kkloudtarus/vera:candidate-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/KKloudTarus/vera
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            VERA_BUILD_GIT_SHA=${{ steps.source.outputs.sha }}
            VERA_BUILD_GIT_DIRTY=false
      - name: Record candidate digest
        run: |
          {
            echo "Evaluate this exact image:"
            echo '```'
            echo "ghcr.io/kkloudtarus/vera@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
