name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push to GHCR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and verify version
        id: version
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$project_version" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi
          echo "value=${project_version}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kkloudtarus/vera:${{ steps.version.outputs.value }}
            ghcr.io/kkloudtarus/vera:latest
          labels: |
            org.opencontainers.image.source=https://github.com/KKloudTarus/vera
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERA_BUILD_GIT_SHA=${{ github.sha }}
            VERA_BUILD_GIT_DIRTY=false
