name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Promote evaluated image
    runs-on: ubuntu-24.04
    environment: release-evidence
    env:
      VERA_TRUSTED_PANEL_RESULT_SHA256: ${{ secrets.VERA_TRUSTED_PANEL_RESULT_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check --constraint constraints.lock jsonschema==4.26.0
      - name: Resolve and verify version
        id: version
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$project_version" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi
          echo "value=${project_version}" >> "$GITHUB_OUTPUT"
      - name: Verify commit-bound release evidence
        id: evidence
        run: |
          set -euo pipefail
          evidence_ref="refs/tags/release-evidence-${GITHUB_SHA}"
          git fetch --no-tags origin "$evidence_ref"
          evidence_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          evidence_root="$RUNNER_TEMP/release-evidence"
          mkdir -p "$evidence_root"
          git archive "$evidence_commit" | tar -xf - -C "$evidence_root"
          image_digest="$(python -m evals.verify_release_gate "$evidence_root" "$GITHUB_SHA")"
          echo "commit=${evidence_commit}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${image_digest}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Promote evaluated digest
        run: |
          set -euo pipefail
          repository="ghcr.io/kkloudtarus/vera"
          digest="${{ steps.evidence.outputs.image_digest }}"
          docker buildx imagetools create \
            --tag "${repository}:${{ steps.version.outputs.value }}" \
            --tag "${repository}:latest" \
            "${repository}@${digest}"
          promoted="sha256:$(docker buildx imagetools inspect \
            "${repository}:${{ steps.version.outputs.value }}" --raw | sha256sum | cut -d ' ' -f 1)"
          if [ "$promoted" != "$digest" ]; then
            echo "promoted image digest ${promoted} differs from evaluated digest ${digest}" >&2
            exit 1
          fi
          {
            echo "Promoted ${repository}@${digest}"
            echo "Evidence commit: ${{ steps.evidence.outputs.commit }}"
          } >> "$GITHUB_STEP_SUMMARY"
