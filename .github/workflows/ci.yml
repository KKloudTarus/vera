name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, arch, unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test image
        run: docker compose -f tests/docker-compose.yml build test
      - name: Ruff (lint)
        run: docker compose -f tests/docker-compose.yml run --rm --no-deps test ruff check src tests evals
      - name: Ruff (format)
        run: docker compose -f tests/docker-compose.yml run --rm --no-deps test ruff format --check src tests evals
      - name: Pyright
        run: docker compose -f tests/docker-compose.yml run --rm --no-deps test pyright
      - name: Import contracts
        run: docker compose -f tests/docker-compose.yml run --rm --no-deps test lint-imports
      - name: Unit tests
        run: docker compose -f tests/docker-compose.yml run --rm --no-deps test pytest -m "not integration and not llm"
      - name: Evaluator contracts
        run: >-
          docker compose -f tests/docker-compose.yml run --rm --no-deps test
          python -m pytest evals/tests tests/unit/test_eval_contract.py -q
      - name: Evaluator validation
        run: docker compose -f tests/docker-compose.yml run --rm --no-deps test python -m evals.validate
      - name: Dependency audit
        run: >-
          docker compose -f tests/docker-compose.yml run --rm --no-deps test
          pip-audit --skip-editable

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build test image
        run: docker compose -f tests/docker-compose.yml build test
      - name: Start integration services
        run: >-
          docker compose -f tests/docker-compose.yml up -d --wait
          postgres neo4j valkey falkordb minio
      - name: Apply migrations
        run: docker compose -f tests/docker-compose.yml run --rm test alembic upgrade head
      - name: Integration tests
        run: >-
          docker compose -f tests/docker-compose.yml run --rm test
          pytest -m "integration and not llm" -rA
      - name: Issue 6 E2E acceptance
        run: >-
          docker compose -f tests/docker-compose.yml run --rm test
          pytest -m "issue6_acceptance and not llm" -rA
      - name: Stop integration services
        if: always()
        run: docker compose -f tests/docker-compose.yml down --volumes
