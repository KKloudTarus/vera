# Default values for a single-cluster VERA pilot. PostgreSQL and the object store are
# authoritative; the graph is a rebuildable projection. The defaults boot with no external
# credentials (deterministic embedder, local MCP principal). Set memory.openaiApiKey and
# flip memory.embedder to openai for real semantic ingestion.

nameOverride: ""
fullnameOverride: ""

image:
  # Published to GHCR by the release workflow; the package is public so the cluster pulls it
  # with no secret. For an air-gapped single-node cluster, build locally and import into the
  # node's containerd, then set repository=vera.
  repository: ghcr.io/kkloudtarus/vera
  tag: "0.2.1"
  pullPolicy: IfNotPresent
  # Numeric UID of the non-root 'vera' user baked into the image (USER vera). kubelet needs
  # the number to enforce runAsNonRoot; keep it in sync with the Dockerfile.
  runAsUser: 999

secrets:
  # true: the chart renders the <release>-secrets Secret from the values below (pilot / local).
  # false: the chart renders no Secret and expects an externally-created <release>-secrets to
  # already exist (GitOps: keep credentials out of git, create the Secret with kubectl). It
  # must carry VERA_DB__DSN, VERA_OBJECTSTORE__ACCESS_KEY/SECRET_KEY, POSTGRES_PASSWORD,
  # MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, and (when set) VERA_MCP__JWT_SECRET,
  # VERA_MEMORY__OPENAI_API_KEY, VERA_NEO4J__PASSWORD, VERA_VOYAGE__API_KEY,
  # VERA_BOOTSTRAP__ADMIN_API_KEY.
  create: true

ingress:
  enabled: false
  className: nginx
  clusterIssuer: letsencrypt-prod
  proxyBodySize: "50m"
  apiHost: ""              # e.g. api-vera.example.net; empty disables the API ingress
  mcpHost: ""              # e.g. mcp-vera.example.net; empty disables the MCP ingress
  apiAnnotations: {}
  mcpAnnotations:
    # MCP streamable HTTP is long-lived (SSE-like): raise timeouts and turn off buffering.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

# local-dev: MCP uses one unauthenticated local principal and the API auth gate is off.
# Set environment to prod, api.authRequired true, and mcp.jwtSecret for a real deployment.
environment: local
logJson: true

api:
  replicas: 1
  authRequired: false
  # Open self-service signup at POST /identity/register. Leave true for a pilot; set false
  # for a shared deployment so only an admin provisions accounts (see the bootstrap block).
  registrationOpen: true
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits: { cpu: "1", memory: "768Mi" }

mcp:
  replicas: 1
  # Empty jwtSecret and no external OAuth verifier + environment=local means MCP serves an
  # unauthenticated local principal (pilot only). Set a long random secret for JWT fallback
  # (with secrets.create=false, provide VERA_MCP__JWT_SECRET in the external secret instead).
  jwtSecret: ""
  # The resource-server audience and built-in JWT issuer. Set authAudience to the public MCP
  # URL so a bearer token's `aud` binds to this server; empty keeps the app defaults.
  authAudience: ""          # e.g. https://mcp-vera.example.net
  authIssuer: ""            # e.g. https://api-vera.example.net
  # Optional external OAuth/OIDC authorization server. It must issue audience-bound JWT access
  # tokens with VERA MCP scopes. oauthIssuer is advertised by RFC 9728 discovery; oauthJwksUrl
  # lets VERA verify its rotating signing keys while coding clients own login and refresh.
  oauthIssuer: ""            # e.g. https://login.example.net
  oauthJwksUrl: ""           # e.g. https://login.example.net/.well-known/jwks.json
  oauthAlgorithms: ["RS256"]
  allowedHosts:
    - "localhost:*"
    - "127.0.0.1:*"
    - "[::1]:*"
    - "vera-mcp"
    - "vera-mcp:*"
    - "vera-mcp.vera.svc.cluster.local"
    - "vera-mcp.vera.svc.cluster.local:*"
  allowedOrigins: []
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits: { cpu: "1", memory: "768Mi" }

worker:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "384Mi" }
    limits: { cpu: "2", memory: "768Mi" }

calibrate:
  enabled: true
  schedule: "0 3 * * *"

# Seed an initial admin so a closed deployment (api.registrationOpen=false) still has a
# first principal that provisions the rest. When enabled a post-install/post-upgrade Job
# runs the idempotent seed. The admin API key is a secret: with secrets.create=false put
# VERA_BOOTSTRAP__ADMIN_API_KEY in the external secret; otherwise set bootstrap.adminApiKey.
bootstrap:
  enabled: false
  adminApiKey: ""             # full vera_<prefix>.<secret>, minted out of band
  adminEmail: "admin@vera.local"
  adminDisplayName: "VERA Admin"
  orgSlug: "root"
  orgName: "Root Organization"
  workspaceSlug: "root"
  workspaceName: "Root Workspace"

memory:
  provider: graphiti          # graphiti | null
  embedder: deterministic     # deterministic (no key) | openai | voyage
  embeddingModel: "text-embedding-3-small"
  embeddingDim: 1536
  llmModel: "gpt-4.1-mini"
  smallLlmModel: "gpt-4.1-nano"
  # Add pgvector dense passage/code retrieval alongside full-text. Needs a real embedder.
  vectorSearchEnabled: false
  # Set to enable the openai embedder and LLM extraction. Leave empty for an offline pilot.
  openaiApiKey: ""

# Voyage AI provider (multilingual embeddings + reranker), used when memory.embedder=voyage
# and/or rerank.crossEncoderProvider=voyage. The API key is a secret: with secrets.create=false
# put VERA_VOYAGE__API_KEY in the external secret; otherwise set voyage.apiKey below.
voyage:
  apiKey: ""
  embeddingModel: "voyage-3.5"
  embeddingDim: 1024
  rerankModel: "rerank-2.5"

rerank:
  # Stage-3 cross-encoder over the reranked head. Off by default (adds a model call per search).
  crossEncoderEnabled: false
  crossEncoderProvider: "llm"   # llm | voyage

graph:
  # neo4j works with the released image out of the box. falkordb is lighter but its Python
  # driver is not in the published image, so it needs an image built with the falkordb extra.
  backend: neo4j              # neo4j | falkordb (needs the falkordb driver in the image)
  falkordb:
    image: falkordb/falkordb:latest
    port: 6379
    storage: 5Gi
    resources:
      requests: { cpu: "100m", memory: "384Mi" }
      limits: { cpu: "1", memory: "1Gi" }
  neo4j:
    image: neo4j:5.26
    password: vera-graph-pass
    storage: 5Gi
    resources:
      requests: { cpu: "250m", memory: "1Gi" }
      limits: { cpu: "1", memory: "2Gi" }

postgres:
  image: pgvector/pgvector:pg18
  user: vera
  password: vera-db-pass
  database: vera
  storage: 10Gi
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits: { cpu: "2", memory: "1Gi" }

valkey:
  image: valkey/valkey:8
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

minio:
  image: minio/minio:latest
  mcImage: minio/mc:latest
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: vera-artifacts
  storage: 10Gi
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "768Mi" }
