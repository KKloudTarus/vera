{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vera.fullname" . }}-bootstrap
  labels: {{- include "vera.labels" . | nindent 4 }}
  annotations:
    # Runtime-role provisioning completes before this hook. The seed is idempotent, so
    # retrying at install and re-running on every upgrade are safe.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "4"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 10
  template:
    metadata:
      labels: {{- include "vera.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext: {{- include "vera.podSecurityContext" . | nindent 8 }}
      initContainers: {{- include "vera.waitForRuntimeDatabase" (dict "root" . "database" "runtime" "role" "vera_app") | nindent 8 }}
      containers:
        - name: bootstrap
          image: {{ include "vera.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "vera.entrypoints.bootstrap_admin"]
          envFrom: {{- include "vera.envFrom" . | nindent 12 }}
          env:
{{- include "vera.applicationSecretEnv" . | nindent 12 }}
{{- include "vera.bootstrapSecretEnv" . | nindent 12 }}
{{- include "vera.runtimeDatabaseEnv" . | nindent 12 }}
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
{{- end }}
