{{- if and .Release.IsUpgrade .Values.secrets.create }}
{{- $name := include "vera.fullname" . }}
{{- $applicationSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" $name) }}
{{- $runtimeSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-runtime" $name) }}
{{- if $runtimeSecret }}
{{- if ne ((index $runtimeSecret.data "VERA_DB__DSN") | default "" | b64dec) (include "vera.runtimeDsn" .) }}
{{- fail "chart-managed PostgreSQL runtime credentials are immutable after install; use externally managed Secrets for rotation" }}
{{- end }}
{{- $workerSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-worker" $name) }}
{{- if not $workerSecret }}
{{- fail "chart-managed PostgreSQL worker Secret is missing during upgrade" }}
{{- else if ne ((index $workerSecret.data "VERA_DB__DSN") | default "" | b64dec) (include "vera.workerDsn" .) }}
{{- fail "chart-managed PostgreSQL worker credentials are immutable after install; use externally managed Secrets for rotation" }}
{{- end }}
{{- $adminSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-database-admin" $name) }}
{{- if not $adminSecret }}
{{- fail "chart-managed PostgreSQL owner Secret is missing during upgrade" }}
{{- else if or (ne ((index $adminSecret.data "POSTGRES_PASSWORD") | default "" | b64dec) (.Values.postgres.password | toString)) (ne ((index $adminSecret.data "VERA_DB__DSN") | default "" | b64dec) (include "vera.adminDsn" .)) }}
{{- fail "chart-managed PostgreSQL owner credentials are immutable after install; use externally managed Secrets for rotation" }}
{{- end }}
{{- else if not .Values.secrets.allowLegacyUpgrade }}
{{- fail "chart-managed PostgreSQL runtime Secret is missing during upgrade" }}
{{- else if not (and $applicationSecret (index $applicationSecret.data "VERA_DB__DSN") (index $applicationSecret.data "POSTGRES_PASSWORD")) }}
{{- fail "legacy chart-managed PostgreSQL credentials are missing during upgrade" }}
{{- else if or (ne ((index $applicationSecret.data "POSTGRES_PASSWORD") | b64dec) (.Values.postgres.password | toString)) (ne ((index $applicationSecret.data "VERA_DB__DSN") | b64dec) (include "vera.adminDsn" .)) }}
{{- fail "legacy chart-managed PostgreSQL owner credentials are immutable during upgrade; preserve the installed values" }}
{{- end }}
{{- $objectAdminSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-objectstore-admin" $name) }}
{{- if $objectAdminSecret }}
{{- if not $applicationSecret }}
{{- fail "chart-managed application Secret is missing during upgrade" }}
{{- else if or (ne ((index $applicationSecret.data "VERA_OBJECTSTORE__ACCESS_KEY") | default "" | b64dec) (.Values.minio.accessKey | toString)) (ne ((index $applicationSecret.data "VERA_OBJECTSTORE__SECRET_KEY") | default "" | b64dec) (.Values.minio.secretKey | toString)) }}
{{- fail "chart-managed MinIO application credentials are immutable after install; use externally managed Secrets for rotation" }}
{{- end }}
{{- if or (ne ((index $objectAdminSecret.data "MINIO_ROOT_USER") | default "" | b64dec) (.Values.minio.rootUser | toString)) (ne ((index $objectAdminSecret.data "MINIO_ROOT_PASSWORD") | default "" | b64dec) (.Values.minio.rootPassword | toString)) }}
{{- fail "chart-managed MinIO root credentials are immutable after install; use externally managed Secrets for rotation" }}
{{- end }}
{{- else if or $runtimeSecret (not .Values.secrets.allowLegacyUpgrade) }}
{{- fail "chart-managed MinIO owner Secret is missing during upgrade" }}
{{- else if not (and $applicationSecret (index $applicationSecret.data "MINIO_ROOT_USER") (index $applicationSecret.data "MINIO_ROOT_PASSWORD")) }}
{{- fail "legacy chart-managed MinIO credentials are missing during upgrade" }}
{{- else if or (ne ((index $applicationSecret.data "VERA_OBJECTSTORE__ACCESS_KEY") | default "" | b64dec) (.Values.minio.accessKey | toString)) (ne ((index $applicationSecret.data "VERA_OBJECTSTORE__SECRET_KEY") | default "" | b64dec) (.Values.minio.secretKey | toString)) (ne ((index $applicationSecret.data "MINIO_ROOT_USER") | default "" | b64dec) (.Values.minio.rootUser | toString)) (ne ((index $applicationSecret.data "MINIO_ROOT_PASSWORD") | default "" | b64dec) (.Values.minio.rootPassword | toString)) }}
{{- fail "legacy chart-managed MinIO credentials are immutable during upgrade; preserve the installed values" }}
{{- end }}
{{- if not $applicationSecret }}
{{- fail "chart-managed application Secret is missing during upgrade" }}
{{- else if and (or $runtimeSecret (not .Values.secrets.allowLegacyUpgrade)) (or (not (index $applicationSecret.data "VERA_NEO4J__PASSWORD")) (not (index $applicationSecret.data "NEO4J_AUTH"))) }}
{{- fail "chart-managed Neo4j credential keys are missing during upgrade" }}
{{- else if and (index $applicationSecret.data "VERA_NEO4J__PASSWORD") (or (ne ((index $applicationSecret.data "VERA_NEO4J__PASSWORD") | b64dec) (.Values.graph.neo4j.password | toString)) (and (or $runtimeSecret (not .Values.secrets.allowLegacyUpgrade)) (ne ((index $applicationSecret.data "NEO4J_AUTH") | default "" | b64dec) (printf "neo4j/%s" .Values.graph.neo4j.password)))) }}
{{- fail "chart-managed Neo4j credentials are immutable after install; use externally managed Secrets for rotation" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vera.fullname" . }}-config
  labels: {{- include "vera.labels" . | nindent 4 }}
data:
  VERA_ENVIRONMENT: {{ .Values.environment | quote }}
  VERA_LOG_JSON: {{ .Values.logJson | quote }}
  VERA_MEMORY__PROVIDER: {{ .Values.memory.provider | quote }}
  VERA_MEMORY__EMBEDDER: {{ .Values.memory.embedder | quote }}
  VERA_MEMORY__EMBEDDING_MODEL: {{ .Values.memory.embeddingModel | quote }}
  VERA_MEMORY__EMBEDDING_DIM: {{ .Values.memory.embeddingDim | quote }}
  VERA_MEMORY__LLM_MODEL: {{ .Values.memory.llmModel | quote }}
  VERA_MEMORY__SMALL_LLM_MODEL: {{ .Values.memory.smallLlmModel | quote }}
  VERA_MEMORY__VECTOR_SEARCH_ENABLED: {{ .Values.memory.vectorSearchEnabled | quote }}
  VERA_MEMORY__GRAPH_BACKEND: {{ .Values.graph.backend | quote }}
{{- if eq .Values.memory.embedder "voyage" }}
  VERA_VOYAGE__EMBEDDING_MODEL: {{ .Values.voyage.embeddingModel | quote }}
  VERA_VOYAGE__EMBEDDING_DIM: {{ .Values.voyage.embeddingDim | quote }}
  VERA_VOYAGE__RERANK_MODEL: {{ .Values.voyage.rerankModel | quote }}
{{- end }}
{{- if .Values.rerank.crossEncoderEnabled }}
  VERA_RERANK__CROSS_ENCODER_ENABLED: "true"
  VERA_RERANK__CROSS_ENCODER_PROVIDER: {{ .Values.rerank.crossEncoderProvider | quote }}
{{- end }}
{{- if eq .Values.graph.backend "neo4j" }}
  VERA_NEO4J__URI: "bolt://{{ include "vera.neo4jHost" . }}:7687"
  VERA_NEO4J__USER: "neo4j"
{{- else }}
  VERA_FALKOR__HOST: {{ include "vera.falkordbHost" . | quote }}
  VERA_FALKOR__PORT: {{ .Values.graph.falkordb.port | quote }}
{{- end }}
  VERA_RESILIENCE__VALKEY_URL: "redis://{{ include "vera.valkeyHost" . }}:6379/0"
  VERA_OBJECTSTORE__ENDPOINT_URL: "http://{{ include "vera.minioHost" . }}:9000"
  VERA_OBJECTSTORE__BUCKET: {{ .Values.minio.bucket | quote }}
  VERA_API__AUTH_REQUIRED: {{ .Values.api.authRequired | quote }}
  VERA_API__REGISTRATION_OPEN: {{ .Values.api.registrationOpen | quote }}
  VERA_DB__ROLE_ENFORCEMENT: "true"
{{- if .Values.bootstrap.enabled }}
  VERA_BOOTSTRAP__ENABLED: "true"
  VERA_BOOTSTRAP__ADMIN_EMAIL: {{ .Values.bootstrap.adminEmail | quote }}
  VERA_BOOTSTRAP__ADMIN_DISPLAY_NAME: {{ .Values.bootstrap.adminDisplayName | quote }}
  VERA_BOOTSTRAP__ORG_SLUG: {{ .Values.bootstrap.orgSlug | quote }}
  VERA_BOOTSTRAP__ORG_NAME: {{ .Values.bootstrap.orgName | quote }}
  VERA_BOOTSTRAP__WORKSPACE_SLUG: {{ .Values.bootstrap.workspaceSlug | quote }}
  VERA_BOOTSTRAP__WORKSPACE_NAME: {{ .Values.bootstrap.workspaceName | quote }}
{{- end }}
  VERA_MCP__ALLOWED_HOSTS: {{ toJson .Values.mcp.allowedHosts | quote }}
  VERA_MCP__ALLOWED_ORIGINS: {{ toJson .Values.mcp.allowedOrigins | quote }}
{{- if .Values.mcp.authAudience }}
  VERA_MCP__AUTH_AUDIENCE: {{ .Values.mcp.authAudience | quote }}
{{- end }}
{{- if .Values.mcp.authIssuer }}
  VERA_MCP__AUTH_ISSUER: {{ .Values.mcp.authIssuer | quote }}
{{- end }}
{{- if .Values.mcp.oauthIssuer }}
  VERA_MCP__OAUTH_ISSUER: {{ .Values.mcp.oauthIssuer | quote }}
{{- end }}
{{- if .Values.mcp.oauthJwksUrl }}
  VERA_MCP__OAUTH_JWKS_URL: {{ .Values.mcp.oauthJwksUrl | quote }}
{{- end }}
  VERA_MCP__OAUTH_ALGORITHMS: {{ toJson .Values.mcp.oauthAlgorithms | quote }}
  VERA_OBSERVABILITY__MCP_METRICS_HOST: "0.0.0.0"
  VERA_OBSERVABILITY__MCP_METRICS_PORT: "9101"
  VERA_OBSERVABILITY__WORKER_METRICS_PORT: "9100"
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vera.fullname" . }}-secrets
  labels: {{- include "vera.labels" . | nindent 4 }}
type: Opaque
stringData:
  VERA_OBJECTSTORE__ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  VERA_OBJECTSTORE__SECRET_KEY: {{ .Values.minio.secretKey | quote }}
  VERA_NEO4J__PASSWORD: {{ .Values.graph.neo4j.password | quote }}
  NEO4J_AUTH: {{ printf "neo4j/%s" .Values.graph.neo4j.password | quote }}
{{- if .Values.memory.openaiApiKey }}
  VERA_MEMORY__OPENAI_API_KEY: {{ .Values.memory.openaiApiKey | quote }}
{{- end }}
{{- if .Values.voyage.apiKey }}
  VERA_VOYAGE__API_KEY: {{ .Values.voyage.apiKey | quote }}
{{- end }}
{{- if .Values.mcp.jwtSecret }}
  VERA_MCP__JWT_SECRET: {{ .Values.mcp.jwtSecret | quote }}
{{- end }}
{{- if .Values.bootstrap.adminApiKey }}
  VERA_BOOTSTRAP__ADMIN_API_KEY: {{ .Values.bootstrap.adminApiKey | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vera.fullname" . }}-objectstore-admin
  labels: {{- include "vera.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vera.fullname" . }}-database-runtime
  labels: {{- include "vera.labels" . | nindent 4 }}
type: Opaque
stringData:
  VERA_DB__DSN: {{ include "vera.runtimeDsn" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vera.fullname" . }}-database-worker
  labels: {{- include "vera.labels" . | nindent 4 }}
type: Opaque
stringData:
  VERA_DB__DSN: {{ include "vera.workerDsn" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vera.fullname" . }}-database-admin
  labels: {{- include "vera.labels" . | nindent 4 }}
type: Opaque
stringData:
  VERA_DB__DSN: {{ include "vera.adminDsn" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  VERA_RUNTIME_PASSWORD: {{ .Values.postgres.runtimePassword | quote }}
  VERA_WORKER_PASSWORD: {{ .Values.postgres.workerPassword | quote }}
{{- end }}
