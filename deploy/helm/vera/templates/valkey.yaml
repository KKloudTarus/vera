apiVersion: v1
kind: Service
metadata:
  name: {{ include "vera.valkeyHost" . }}
  labels: {{- include "vera.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    vera.component: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vera.valkeyHost" . }}
  labels: {{- include "vera.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      vera.component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        vera.component: valkey
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
