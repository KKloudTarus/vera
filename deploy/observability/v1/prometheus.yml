global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/rules/prometheus-alerts.yaml

scrape_configs:
  - job_name: vera-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: vera-worker
    static_configs:
      - targets: ["worker:9100"]
  - job_name: vera-eval-product-exercises
    static_configs:
      - targets: ["evaluator:9200"]
