# Local development stack. All services are vendor-neutral, self-hostable, cloud-portable.
# No managed single-cloud services (no SQS/DynamoDB/etc.).
name: vera

services:
  postgres:
    # pgvector's image is the official postgres:18 plus the `vector` extension, so the data
    # layout is identical and enabling pgvector needs no data migration. Stock postgres:18 also
    # works: the vector migration is a no-op when the extension is unavailable.
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera
      POSTGRES_DB: vera
    ports: ["${VERA_POSTGRES_HOST_PORT:-5432}:5432"]
    # postgres:18+ stores data in a versioned subdir; mount the parent per the image guidance.
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26@sha256:037cf5756f0135cbfd66b739b6df7c7c4bb100f9ce11602f6f9538e17e02c74d
    environment:
      NEO4J_AUTH: neo4j/vera-local-pass
      NEO4J_PLUGINS: '["apoc"]'
    ports: ["7474:7474", "7687:7687"]
    volumes: ["./.data/neo4j:/data"]

  valkey:
    image: valkey/valkey:8@sha256:f0ba225266310efba5fb33383e21c64fbd07907304224786c780606e7ebd7327
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  # Optional alternative graph backend to Neo4j (VERA_MEMORY__GRAPH_BACKEND=falkordb).
  # Host port 6380 avoids the Valkey 6379 clash; container speaks Redis on 6379.
  falkordb:
    image: falkordb/falkordb@sha256:adbddd418916c25618564ff8597a919b08bc76452ebeb74eb985c38d7281df62
    profiles: ["falkordb"]
    ports: ["6380:6379"]
    volumes: ["./.data/falkordb:/data"]

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./.data/minio:/data"]

  # Application processes, all from one image. They stay under the "app" profile so the
  # default `docker compose up` brings only local infra; run them with:
  #   docker compose --profile app up --build
  migrate:
    build: .
    profiles: ["app"]
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment: &app_env
      VERA_DB__DSN: postgresql+asyncpg://vera:vera@postgres:5432/vera
      VERA_NEO4J__URI: bolt://neo4j:7687
      VERA_NEO4J__USER: neo4j
      VERA_NEO4J__PASSWORD: vera-local-pass
      VERA_MEMORY__PROVIDER: graphiti
      VERA_FALKOR__HOST: falkordb
      VERA_FALKOR__PORT: 6379
      VERA_RESILIENCE__VALKEY_URL: redis://valkey:6379/0
      VERA_OBJECTSTORE__ENDPOINT_URL: http://minio:9000
      VERA_OBJECTSTORE__ACCESS_KEY: minioadmin
      VERA_OBJECTSTORE__SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    profiles: ["app"]
    env_file:
      - path: .env
        required: false
    environment: *app_env
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    profiles: ["app"]
    command: ["python", "-m", "vera.entrypoints.worker.main"]
    env_file:
      - path: .env
        required: false
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    build: .
    profiles: ["app"]
    command: ["python", "-m", "vera.entrypoints.mcp.main"]
    env_file:
      - path: .env
        required: false
    environment: *app_env
    ports: ["8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
